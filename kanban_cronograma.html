<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cronograma de Entregas — DINALOG/CEDIS</title>
<link rel="icon" href="./favicon.ico?v=1"/>
<style>
  :root{--azul:#1e5a9e;--azul2:#0C447C;--bg:#ececec;--card:#fff;--bord:#a8a8a8;
    --txt:#20303f;--sub:#6b7684;--ok:#1c7c3a;--okbg:#e2efda;--ambar:#BA7517;--ambarbg:#faeeda;--rojo:#a12626;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;}
  .num{font-family:Consolas,"Courier New",monospace;}
  .top{display:flex;align-items:center;gap:14px;padding:14px 22px;background:linear-gradient(90deg,#0b1f3a,#133a74);color:#fff;}
  .top img{width:38px;height:38px;object-fit:contain;}
  .top h1{font-size:18px;font-weight:700;}
  .top .sub{font-size:11px;opacity:.8;}
  .top .spacer{flex:1;}
  .top .gen{font-size:11px;opacity:.75;text-align:right;}
  .top .gen b{display:block;font-size:13px;}
  .tabs{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--bord);padding:0 22px;}
  .tab{padding:13px 26px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;}
  .tab.active{color:var(--azul2);border-bottom-color:var(--azul);}
  .tab .cnt{font-family:Consolas,monospace;font-size:11px;background:#eef2f6;padding:1px 7px;border-radius:9px;margin-left:6px;}
  .bar{background:var(--card);border-bottom:1px solid var(--bord);padding:9px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:11px;height:11px;border-radius:2px;display:inline-block;}
  .dot.l{background:var(--ok);}.dot.p{background:var(--ambar);}.dot.r{background:#8fa2b5;}
  .bar .spacer{flex:1;}
  .btn{background:var(--azul2);color:#fff;border:0;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;border-radius:4px;}
  .week{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:18px 22px;}
  .day{background:var(--card);border:1px solid var(--bord);display:flex;flex-direction:column;min-height:200px;}
  .day.hoy{border:2px solid var(--azul);box-shadow:0 0 0 2px rgba(30,90,158,.12);}
  .day-h{background:var(--azul2);color:#fff;padding:10px 12px;}
  .day-h .d{font-size:14px;font-weight:700;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;}
  .day-h .badge{font-size:9px;background:#fff;color:var(--azul2);padding:2px 7px;border-radius:9px;font-weight:700;}
  .day-h .cnt{font-family:Consolas,monospace;font-size:11px;opacity:.85;margin-top:3px;}
  .day-body{padding:8px;overflow-y:auto;flex:1;}
  .ue{border:1px solid #e0e6ee;border-left:3px solid #8fa2b5;padding:8px 10px;margin-bottom:7px;background:#fafbfc;}
  .ue.hasready{border-left-color:var(--ok);}
  .ue .n{font-size:12px;font-weight:600;line-height:1.25;margin-bottom:5px;}
  .ue .bars{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
  .pill{font-family:Consolas,monospace;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;}
  .pill.l{background:var(--okbg);color:var(--ok);}
  .pill.p{background:var(--ambarbg);color:var(--ambar);}
  .pill.r{background:#eef2f6;color:#5a6b7a;}
  .ue .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .timer{font-family:Consolas,monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;}
  .timer.hoy{background:#fcebeb;color:var(--rojo);}
  .timer.pronto{background:var(--ambarbg);color:var(--ambar);}
  .timer.ok{background:var(--okbg);color:var(--ok);}
  .vol{font-size:10px;color:var(--sub);}
  .empty-day{color:#b0bcc8;font-size:11px;text-align:center;padding:30px 8px;}
  .loading{padding:60px;text-align:center;color:var(--sub);font-size:15px;}
  /* mensuales FIFO */
  .fifo{padding:18px 22px;}
  .fifo table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bord);}
  .fifo th{background:var(--azul2);color:#fff;font-size:12px;padding:10px 12px;text-align:left;}
  .fifo td{padding:9px 12px;font-size:13px;border-bottom:1px solid #eef2f6;}
  .fifo tr:hover td{background:#f7fafd;}
  .fifo .pos{font-family:Consolas,monospace;font-weight:700;color:var(--azul);}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="top">
  <img src="./icons/icon-512.png" onerror="this.style.display='none'"/>
  <div><h1>Cronograma de Entregas</h1><div class="sub">Torre de Control · DINALOG / CEDIS · Qué despachar y cuándo debe estar listo</div></div>
  <div class="spacer"></div>
  <div class="gen" id="gen"></div>
</div>
<div class="tabs">
  <div class="tab active" id="tabUrg" onclick="setTab('urg')">Urgencias <span class="cnt" id="cntUrg">·</span></div>
  <div class="tab" id="tabMen" onclick="setTab('men')">Mensuales (FIFO 15 días) <span class="cnt" id="cntMen">·</span></div>
</div>
<div class="bar">
  <div class="legend">
    <span><i class="dot l"></i> Listos para despachar</span>
    <span><i class="dot p"></i> En proceso</span>
    <span><i class="dot r"></i> Recién recibidos</span>
  </div>
  <div class="spacer"></div>
  <button class="btn" onclick="cargar()">↻ Actualizar</button>
</div>
<div id="viewUrg"><div id="week" class="week"><div class="loading" style="grid-column:1/-1">Cargando cronograma…</div></div></div>
<div id="viewMen" class="hidden"><div class="fifo" id="fifo"></div></div>

<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbyVHDQ8IuVHibz259AiEvZ-jUfVC7fxvSSqC-wfaiiq1_13C9_TK4dVtPK0SMW4sZoJ/exec";
const DIAS=['LUNES','MARTES','MIERCOLES','JUEVES','VIERNES'];
let DATA=null;

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='cb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script'); let done=false;
    const t=setTimeout(()=>{if(done)return;done=true;s.remove();rej(new Error('Timeout'));},25000);
    s.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb+'&_ts='+Date.now();
    s.onerror=()=>{if(done)return;done=true;clearTimeout(t);s.remove();rej(new Error('Red'));};
    window[cb]=(d)=>{if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove();res(d);};
    document.body.appendChild(s);
  });
}
function setTab(t){
  document.getElementById('tabUrg').classList.toggle('active',t==='urg');
  document.getElementById('tabMen').classList.toggle('active',t==='men');
  document.getElementById('viewUrg').classList.toggle('hidden',t!=='urg');
  document.getElementById('viewMen').classList.toggle('hidden',t!=='men');
}
async function cargar(){
  document.getElementById('week').innerHTML='<div class="loading" style="grid-column:1/-1">Cargando cronograma…</div>';
  try{ DATA=await jsonp(WEBAPP+'?file=kanban_cronograma_v2'); render(DATA); }
  catch(e){ document.getElementById('week').innerHTML='<div class="loading" style="grid-column:1/-1;color:#a12626">Sin conexión.</div>'; }
}
function timerHTML(d){
  if(d===null||d===undefined) return '';
  if(d===0) return '<span class="timer hoy">HOY</span>';
  if(d<=2) return '<span class="timer pronto">en '+d+'d</span>';
  return '<span class="timer ok">en '+d+'d</span>';
}
function render(r){
  document.getElementById('gen').innerHTML='<b>Hoy: '+(r.diaHoy||'')+'</b>'+(r.generado||'');
  // contar
  let totUrg=0; DIAS.forEach(d=>totUrg+=((r.urgencias&&r.urgencias[d])||[]).length);
  document.getElementById('cntUrg').textContent=totUrg;
  document.getElementById('cntMen').textContent=(r.mensuales||[]).length;

  // URGENCIAS por día
  let html='';
  DIAS.forEach(dia=>{
    const ues=(r.urgencias&&r.urgencias[dia])||[];
    const totListos=ues.reduce((a,u)=>a+u.listos,0);
    const esHoy=(r.diaHoy===dia);
    html+='<div class="day'+(esHoy?' hoy':'')+'">'+
      '<div class="day-h"><div class="d"><span>'+dia+'</span>'+(esHoy?'<span class="badge">HOY</span>':'')+'</div>'+
        '<div class="cnt">'+ues.length+' UE · '+totListos+' listos</div></div>'+
      '<div class="day-body">';
    if(!ues.length){ html+='<div class="empty-day">Sin UEs</div>'; }
    else ues.forEach(u=>{
      html+='<div class="ue'+(u.listos>0?' hasready':'')+'">'+
        '<div class="n">'+u.ue+'</div>'+
        '<div class="bars">'+
          (u.listos>0?'<span class="pill l">'+u.listos+' listos</span>':'')+
          (u.proceso>0?'<span class="pill p">'+u.proceso+' proc.</span>':'')+
          (u.recibidos>0?'<span class="pill r">'+u.recibidos+' recib.</span>':'')+
        '</div>'+
        '<div class="foot">'+timerHTML(u.diasRestantes)+
          '<span class="vol">≈ '+(u.bultosEstimados||0)+' bultos</span></div>'+
      '</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('week').innerHTML=html;

  // MENSUALES FIFO
  const men=r.mensuales||[];
  let f='<table><thead><tr><th>#</th><th>Unidad Ejecutora</th><th>CEDIS</th><th>Listos</th><th>En proceso</th><th>Total</th><th>Vol. estim.</th></tr></thead><tbody>';
  if(!men.length) f+='<tr><td colspan="7" style="text-align:center;color:#b0bcc8;padding:30px">Sin pedidos mensuales pendientes</td></tr>';
  else men.forEach((u,i)=>{
    f+='<tr><td class="pos">'+(i+1)+'</td><td><b>'+u.ue+'</b></td><td>'+(u.cedis||'')+'</td>'+
      '<td>'+u.listos+'</td><td>'+u.proceso+'</td><td class="num">'+u.total+'</td>'+
      '<td class="vol">≈ '+(u.bultosEstimados||0)+' bultos</td></tr>';
  });
  f+='</tbody></table><p style="font-size:11px;color:#6b7684;margin-top:10px">Orden FIFO por recepción más antigua — los que llevan más tiempo esperando salen primero (ciclo 15 días).</p>';
  document.getElementById('fifo').innerHTML=f;
}
cargar();
</script>
</body>
</html>
