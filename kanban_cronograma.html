<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cronograma de Entregas — DINALOG/CEDIS</title>
<link rel="icon" href="./favicon.ico?v=1"/>
<style>
  :root{
    --azul:#1e5a9e; --azul2:#0C447C; --bg:#ececec; --card:#fff; --bord:#a8a8a8;
    --txt:#20303f; --sub:#6b7684; --ok:#1c7c3a; --okbg:#e2efda;
    --ambar:#BA7517; --ambarbg:#faeeda; --rojo:#a12626;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;}
  .num{font-family:Consolas,"Courier New",monospace;}
  .top{display:flex;align-items:center;gap:14px;padding:14px 22px;
       background:linear-gradient(90deg,#0b1f3a,#133a74);color:#fff;}
  .top img{width:38px;height:38px;object-fit:contain;}
  .top h1{font-size:18px;font-weight:700;}
  .top .sub{font-size:11px;opacity:.8;}
  .top .spacer{flex:1;}
  .top .gen{font-size:11px;opacity:.75;text-align:right;}
  .top .gen b{display:block;font-size:13px;}

  .bar{background:var(--card);border-bottom:1px solid var(--bord);padding:10px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:11px;height:11px;border-radius:2px;display:inline-block;}
  .dot.l{background:var(--ok);} .dot.p{background:var(--ambar);} .dot.a{background:#8fa2b5;}
  .bar .spacer{flex:1;}
  .btn{background:var(--azul2);color:#fff;border:0;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;border-radius:4px;}

  .week{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:18px 22px;}
  .day{background:var(--card);border:1px solid var(--bord);display:flex;flex-direction:column;min-height:200px;}
  .day.hoy{border:2px solid var(--azul);box-shadow:0 0 0 2px rgba(30,90,158,.12);}
  .day-h{background:var(--azul2);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;}
  .day-h .d{font-size:14px;font-weight:700;letter-spacing:.5px;}
  .day-h .badge{font-size:9px;background:#fff;color:var(--azul2);padding:2px 7px;border-radius:9px;font-weight:700;}
  .day-h .cnt{font-family:Consolas,monospace;font-size:12px;opacity:.85;}
  .day-body{padding:8px;overflow-y:auto;flex:1;}

  .ue{border:1px solid #e0e6ee;border-left:3px solid #8fa2b5;padding:8px 10px;margin-bottom:7px;background:#fafbfc;}
  .ue.hasready{border-left-color:var(--ok);}
  .ue .n{font-size:12px;font-weight:600;line-height:1.25;margin-bottom:5px;}
  .ue .bars{display:flex;gap:4px;align-items:center;}
  .pill{font-family:Consolas,monospace;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;}
  .pill.l{background:var(--okbg);color:var(--ok);}
  .pill.p{background:var(--ambarbg);color:var(--ambar);}
  .pill.a{background:#eef2f6;color:#5a6b7a;}
  .ue .cedis{font-size:9px;color:var(--sub);margin-top:4px;}

  .empty-day{color:#b0bcc8;font-size:11px;text-align:center;padding:30px 8px;}
  .loading{padding:60px;text-align:center;color:var(--sub);font-size:15px;}
  .sindia{margin:0 22px 20px;background:#fff;border:1px solid var(--bord);padding:12px 16px;}
  .sindia h3{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .sindia .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .sindia .chip{font-size:11px;background:#eef2f6;padding:4px 10px;border-radius:10px;color:#5a6b7a;}
</style>
</head>
<body>

<div class="top">
  <img src="./icons/icon-512.png" onerror="this.style.display='none'"/>
  <div>
    <h1>Cronograma de Entregas</h1>
    <div class="sub">Torre de Control · DINALOG / CEDIS · Qué despachar cada día</div>
  </div>
  <div class="spacer"></div>
  <div class="gen" id="gen"></div>
</div>

<div class="bar">
  <div class="legend">
    <span><i class="dot l"></i> Listos para despachar</span>
    <span><i class="dot p"></i> En proceso</span>
    <span><i class="dot a"></i> Por empezar (asignados)</span>
  </div>
  <div class="spacer"></div>
  <button class="btn" onclick="cargar()">↻ Actualizar</button>
</div>

<div id="week" class="week"><div class="loading" style="grid-column:1/-1">Cargando cronograma…</div></div>
<div id="sindia"></div>

<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbyVHDQ8IuVHibz259AiEvZ-jUfVC7fxvSSqC-wfaiiq1_13C9_TK4dVtPK0SMW4sZoJ/exec";
const DIAS=['LUNES','MARTES','MIERCOLES','JUEVES','VIERNES'];

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='cb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script'); let done=false;
    const t=setTimeout(()=>{if(done)return;done=true;s.remove();rej(new Error('Timeout'));},25000);
    s.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb+'&_ts='+Date.now();
    s.onerror=()=>{if(done)return;done=true;clearTimeout(t);s.remove();rej(new Error('Red'));};
    window[cb]=(d)=>{if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove();res(d);};
    document.body.appendChild(s);
  });
}

async function cargar(){
  document.getElementById('week').innerHTML='<div class="loading" style="grid-column:1/-1">Cargando cronograma…</div>';
  try{
    const r=await jsonp(WEBAPP+'?file=kanban_cronograma');
    render(r);
  }catch(e){
    document.getElementById('week').innerHTML='<div class="loading" style="grid-column:1/-1;color:#a12626">Sin conexión. Intenta de nuevo.</div>';
  }
}

function render(r){
  document.getElementById('gen').innerHTML='<b>Hoy: '+(r.diaHoy||'')+'</b>'+(r.generado||'');
  const wk=document.getElementById('week');
  let html='';
  DIAS.forEach(dia=>{
    const ues=(r.dias&&r.dias[dia])||[];
    const totListos=ues.reduce((a,u)=>a+u.listos,0);
    const esHoy=(r.diaHoy===dia);
    html+='<div class="day'+(esHoy?' hoy':'')+'">'+
      '<div class="day-h"><span class="d">'+dia+(esHoy?' <span class="badge">HOY</span>':'')+'</span>'+
        '<span class="cnt">'+ues.length+' UE · '+totListos+' listos</span></div>'+
      '<div class="day-body">';
    if(!ues.length){ html+='<div class="empty-day">Sin UEs este día</div>'; }
    else ues.forEach(u=>{
      html+='<div class="ue'+(u.listos>0?' hasready':'')+'">'+
        '<div class="n">'+u.ue+'</div>'+
        '<div class="bars">'+
          (u.listos>0?'<span class="pill l">'+u.listos+' listos</span>':'')+
          (u.enProceso>0?'<span class="pill p">'+u.enProceso+' proc.</span>':'')+
          (u.porEmpezar>0?'<span class="pill a">'+u.porEmpezar+' asig.</span>':'')+
        '</div>'+
        (u.cedis&&u.cedis!=='SIN CEDIS'?'<div class="cedis">'+u.cedis+'</div>':'')+
      '</div>';
    });
    html+='</div></div>';
  });
  wk.innerHTML=html;

  // UEs sin día (nodos/inter-CEDIS)
  const sd=r.sinDia||[];
  const box=document.getElementById('sindia');
  if(sd.length){
    box.innerHTML='<div class="sindia"><h3>Sin día de cronograma ('+sd.length+') — nodos CEDIS e inter-CEDIS</h3>'+
      '<div class="chips">'+sd.map(u=>'<span class="chip">'+u.ue+' · '+u.total+'</span>').join('')+'</div></div>';
  } else box.innerHTML='';
}

cargar();
</script>
</body>
</html>
