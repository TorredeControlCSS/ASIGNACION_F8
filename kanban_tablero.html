<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kanban de Seguimiento — Tablero del Almacén por Unidad Ejecutora</title>
<link rel="icon" href="./favicon.ico?v=1"/>
<style>
  :root{
    --azul:#1e5a9e;--azul2:#0C447C;--deg1:#0b1f3a;--deg2:#133a74;
    --bg:#ececec;--bord:#a8a8a8;--txt:#20303f;--sub:#6b7684;
    --m-recep:#888780;--m-asig:#BA7517;--m-recol:#378ADD;--m-fact:#639922;--m-dist:#0F6E56;
    --rojo:#a12626;
    --pc-recep:#ececeb;--pc-asig:#f6ecd9;--pc-recol:#e2eefb;--pc-fact:#eaf3dd;--pc-dist:#dcefe8;
  }
  *{box-sizing:border-box;}
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--txt);}
  .num{font-family:Consolas,"Courier New",monospace;}
  .topbar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:linear-gradient(90deg,var(--deg1),var(--deg2));color:#fff;position:sticky;top:0;z-index:9999;box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .topbar img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:50%;}
  .topbar h1{font-size:15px;margin:0;font-weight:700;}
  .topbar .sub{font-size:11px;opacity:.85;margin-top:2px;}
  .topbar .spacer{flex:1;}
  .topbar .gen{font-size:11px;opacity:.85;text-align:right;line-height:1.5;}
  .wrap{max-width:1340px;margin:0 auto;padding:14px;}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;}
  .kpi{border:1px solid var(--bord);padding:12px 14px;border-radius:2px;}
  .kpi .lbl{font-size:10px;color:#4a5560;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
  .kpi .val{font-size:26px;font-weight:700;font-family:Consolas,monospace;line-height:1.1;margin-top:2px;}
  .kpi.recep{background:var(--pc-recep);} .kpi.recep .val{color:#5f5e58;}
  .kpi.asig{background:var(--pc-asig);}   .kpi.asig .val{color:#8a5810;}
  .kpi.recol{background:var(--pc-recol);} .kpi.recol .val{color:#1f6bb8;}
  .kpi.fact{background:var(--pc-fact);}   .kpi.fact .val{color:#4c7519;}
  .kpi.dist{background:var(--pc-dist);}   .kpi.dist .val{color:#0d5a48;}
  .lat{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--bord);border-left:4px solid var(--rojo);padding:11px 16px;margin-bottom:12px;}
  .lat .big{font-size:26px;font-weight:700;font-family:Consolas,monospace;color:var(--rojo);}
  .lat .desc{font-size:12px;color:var(--sub);} .lat .desc b{color:var(--txt);}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--bord);padding:9px 11px;margin-bottom:10px;}
  .toolbar label{font-size:11px;color:var(--sub);}
  .toolbar select,.toolbar input[type=text]{padding:5px 7px;border:1px solid var(--bord);font-size:12px;}
  .toolbar .btn{padding:6px 12px;border:1px solid var(--azul2);background:var(--azul);color:#fff;cursor:pointer;font-size:12px;font-weight:600;}
  .toolbar .btn.sec{background:#fff;color:var(--azul2);}
  .toolbar .spacer{flex:1;} .toolbar .count{font-size:11px;color:var(--sub);}
  table.ue{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bord);font-size:12px;}
  table.ue th{background:var(--azul2);color:#fff;padding:7px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:56px;cursor:pointer;user-select:none;}
  table.ue th.r{text-align:right;}table.ue th.c{text-align:center;}
  table.ue td{padding:6px 8px;border-top:1px solid #eee;vertical-align:middle;}
  tr.ue-row{cursor:pointer;} tr.ue-row:hover td{background:#f4f7fb;} tr.ue-row.abierta td{background:#eef3fa;}
  .caret{display:inline-block;width:12px;color:var(--azul2);font-weight:700;transition:transform .1s;}
  .caret.abierto{transform:rotate(90deg);}
  .ue-name{font-weight:700;color:var(--azul2);}
  .ue-meta{font-size:10px;color:var(--sub);}
  .badge-hoy{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;background:#fcebeb;color:var(--rojo);margin-left:5px;}
  .badge-man{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;background:#faeeda;color:#854F0B;margin-left:5px;}
  td.n{font-family:Consolas,monospace;text-align:right;}
  .prog{display:flex;height:18px;width:100%;min-width:170px;border:1px solid #ddd;overflow:hidden;background:#f6f6f6;}
  .prog span{display:block;height:100%;}
  .pend-alert{color:var(--rojo);font-weight:700;}
  tr.grupo-row{cursor:pointer;} tr.grupo-row td{background:#fafbfc;border-top:1px dotted #dde;}
  tr.grupo-row.abierta td{background:#f0f4f8;}
  .grupo-name{padding-left:26px;font-size:11px;color:#2f4a5e;font-weight:700;}
  .grupo-name .caret{font-size:10px;}
  tr.f8-head td{background:#f3f6fa;font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:#5a6b7a;font-weight:700;padding:4px 8px;}
  tr.f8-row td{background:#fff;border-top:1px solid #f0f0f0;font-size:11px;}
  .f8-id{padding-left:48px;font-family:Consolas,monospace;color:#333;}
  .f8-etapa{display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:2px;color:#fff;}
  .chip-tipo{font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;}
  .tipo-urg{background:#fcebeb;color:var(--rojo);} .tipo-men{background:#eef2f6;color:#5a6b7a;}
  .fecha-ent{font-family:Consolas,monospace;font-size:11px;}
  .fecha-venc{color:var(--rojo);font-weight:700;}
  .f8-load{padding-left:48px;color:var(--sub);font-style:italic;}
  .empty{padding:36px;text-align:center;color:var(--sub);background:#fff;border:1px solid var(--bord);}
  .loading{padding:26px;text-align:center;color:var(--sub);}
  .leyenda{display:flex;flex-wrap:wrap;gap:14px;margin:8px 2px 12px;font-size:10px;color:var(--sub);}
  .leyenda .dot{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:middle;}
  .err{background:#fdecea;border:1px solid #f5c6cb;color:#a11b11;padding:12px 16px;margin-bottom:10px;font-size:12px;}
</style>
</head>
<body>
<div class="topbar">
  <img src="./icons/icon-512.png" alt="logo" onerror="this.style.display='none'"/>
  <div><h1>Kanban de Seguimiento &mdash; Tablero del Almac&eacute;n</h1>
    <div class="sub">Torre de Control &middot; DINALOG / CEDIS &middot; Solo lectura</div></div>
  <div class="spacer"></div><div class="gen" id="gen"></div>
</div>
<div class="wrap">
  <div id="errBox"></div>
  <div class="kpis">
    <div class="kpi recep"><div class="lbl">Recepci&oacute;n</div><div class="val num" id="k_recep">&ndash;</div></div>
    <div class="kpi asig"><div class="lbl">Asignaci&oacute;n</div><div class="val num" id="k_asig">&ndash;</div></div>
    <div class="kpi recol"><div class="lbl">Recolecci&oacute;n</div><div class="val num" id="k_recol">&ndash;</div></div>
    <div class="kpi fact"><div class="lbl">Facturaci&oacute;n</div><div class="val num" id="k_fact">&ndash;</div></div>
    <div class="kpi dist"><div class="lbl">Distribuci&oacute;n</div><div class="val num" id="k_dist">&ndash;</div></div>
  </div>
  <div class="toolbar">
    <label>CEDIS:</label><select id="fCedis"><option value="TODOS">&mdash; Todos &mdash;</option></select>
    <label>Regi&oacute;n:</label><select id="fRegion"><option value="">&mdash; Todas &mdash;</option></select>
    <label>Grupo:</label><select id="fGrupo"><option value="">&mdash; Todos &mdash;</option></select>
    <label>Unidad Ejecutora:</label><select id="fUE"><option value="">&mdash; Todas &mdash;</option></select>
    <input type="text" id="fBuscar" placeholder="Buscar UE..."/>
    <label><input type="checkbox" id="fHoyMan"/> Solo entregas hoy/ma&ntilde;ana</label>
    <button class="btn sec" id="btnRefresh">&#8635; Actualizar</button>
    <div class="spacer"></div><span class="count" id="cnt"></span>
  </div>
  <div class="leyenda" id="leyenda"></div>
  <div id="tabla"><div class="loading">Cargando tablero&hellip;</div></div>
</div>
<script>
const WEBAPP_BASE = "https://script.google.com/macros/s/AKfycbyVHDQ8IuVHibz259AiEvZ-jUfVC7fxvSSqC-wfaiiq1_13C9_TK4dVtPK0SMW4sZoJ/exec";
let DATA=null, UES=[], MACROS=[], sortCol=null, sortDir=1;
const abiertas=new Set();        // UE expandidas
const gruposAbiertos=new Set();  // "UE||GRUPO" expandidos
const f8cache={};                // "UE||GRUPO" -> array de F8 (on-demand)

const COLOR = {RECEPCION:'#888780',ASIGNACION:'#BA7517',RECOLECCION:'#378ADD',FACTURACION:'#639922',DISTRIBUCION:'#0F6E56'};

async function pedir(params){
  const url=`${WEBAPP_BASE}?${params}&_ts=${Date.now()}`;
  const res=await fetch(url,{method:'GET',redirect:'follow'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function cargar(){
  document.getElementById('tabla').innerHTML='<div class="loading">Cargando tablero&hellip;</div>';
  document.getElementById('errBox').innerHTML='';
  try{
    const res=await pedir('file=kanban_tablero_almacen');
    if(!res||res.ok===false) throw new Error((res&&res.msg)||'Respuesta vac\u00eda');
    DATA=res; UES=res.ues||[]; MACROS=res.macros||[];
    document.getElementById('gen').innerHTML='Actualizado: '+(res.generado||'\u2014')+'<br>Hoy: '+(res.diaHoy||'\u2014')+' \u00b7 '+(res.totalGeneral||0)+' F8 activas';
    pintarLeyenda(); pintarKPIs(res.resumen); poblarFiltros(); render();
  }catch(err){
    document.getElementById('errBox').innerHTML='<div class="err">No se pudo cargar el tablero: '+err.message+'. Revisa que el endpoint <b>kanban_tablero_almacen</b> est\u00e9 desplegado en el WebApp.</div>';
    document.getElementById('tabla').innerHTML='';
  }
}
function pintarLeyenda(){
  document.getElementById('leyenda').innerHTML=MACROS.map(m=>`<span><span class="dot" style="background:${m.color}"></span>${m.label}</span>`).join('');
}
function pintarKPIs(r){
  if(!r)return;
  const set=(id,k)=>{const el=document.getElementById(id); if(el) el.textContent=(r[k]||0).toLocaleString();};
  set('k_recep','RECEPCION');set('k_asig','ASIGNACION');set('k_recol','RECOLECCION');set('k_fact','FACTURACION');set('k_dist','DISTRIBUCION');
}
function poblarFiltros(){
  const cedis=[...new Set(UES.map(u=>u.cedis))].filter(Boolean).sort();
  const regs=[...new Set(UES.map(u=>u.region).filter(Boolean))].sort();
  const grupos=[...new Set(UES.flatMap(u=>(u.grupos||[]).map(g=>g.grupo)))].filter(Boolean).sort();
  const ues=[...new Set(UES.map(u=>u.ue))].filter(Boolean).sort();
  fill('fCedis','TODOS','\u2014 Todos \u2014',cedis);
  fill('fRegion','','\u2014 Todas \u2014',regs);
  fill('fGrupo','','\u2014 Todos \u2014',grupos);
  fill('fUE','','\u2014 Todas \u2014',ues);
}
function fill(id,allVal,allLbl,arr){
  const s=document.getElementById(id), prev=s.value;
  s.innerHTML=`<option value="${allVal}">${allLbl}</option>`+arr.map(x=>`<option>${x}</option>`).join('');
  s.value=[...s.options].some(o=>o.value===prev)?prev:allVal;
}
function proyectar(u,fg){
  if(!fg) return u;
  const g=(u.grupos||[]).find(x=>x.grupo===fg);
  if(!g) return null;
  return Object.assign({},u,{total:g.total,pend:g.pend,macro:g.macro,grupos:[g]});
}
function filtrados(){
  const fc=document.getElementById('fCedis').value;
  const fr=document.getElementById('fRegion').value;
  const fg=document.getElementById('fGrupo').value;
  const fu=document.getElementById('fUE').value;
  const q=document.getElementById('fBuscar').value.trim().toLowerCase();
  const hm=document.getElementById('fHoyMan').checked;
  let arr=[];
  UES.forEach(u=>{
    if(fc && fc!=='TODOS' && u.cedis!==fc) return;
    if(fr && u.region!==fr) return;
    if(fu && u.ue!==fu) return;
    if(q && !u.ue.toLowerCase().includes(q)) return;
    if(hm && !(u.entregaHoy||u.entregaManana)) return;
    const pu=proyectar(u,fg);
    if(pu) arr.push(pu);
  });
  if(sortCol){
    arr=arr.slice().sort((a,b)=>{
      let va,vb;
      if(sortCol==='ue'){va=a.ue;vb=b.ue;}
      else if(sortCol==='total'){va=a.total;vb=b.total;}
      else if(sortCol==='pend'){va=a.pend;vb=b.pend;}
      else {va=a.macro[sortCol]||0;vb=b.macro[sortCol]||0;}
      if(va<vb)return -1*sortDir; if(va>vb)return 1*sortDir; return 0;
    });
  }
  return arr;
}
function barra(macro,total){
  const t=total||1;
  const seg=m=>{const v=macro[m.clave]||0; return v>0?`<span style="width:${(v/t*100)}%;background:${m.color}" title="${m.label}: ${v}"></span>`:'';};
  return `<div class="prog">${MACROS.map(seg).join('')}</div>`;
}
function celdasMacro(macro){ return MACROS.map(m=>`<td class="n">${macro[m.clave]||0}</td>`).join(''); }

function render(){
  const arr=filtrados();
  document.getElementById('cnt').textContent=arr.length+' UE';
  const cont=document.getElementById('tabla');
  if(!arr.length){cont.innerHTML='<div class="empty">No hay unidades con este filtro.</div>';return;}
  const th=(lbl,col,cls)=>`<th class="${cls||''}" onclick="setSort('${col}')">${lbl}${sortCol===col?(sortDir>0?' \u25b2':' \u25bc'):''}</th>`;
  const thMacro=MACROS.map(m=>th(m.label.slice(0,6),m.clave,'r')).join('');
  let html=`<table class="ue"><thead><tr>
    ${th('Unidad Ejecutora','ue')}<th>Entrega</th>${th('Total','total','r')}${th('Pend.','pend','r')}
    <th class="c">Termograf\u00eda</th>${thMacro}</tr></thead><tbody>`;
  arr.forEach(u=>{
    const abierta=abiertas.has(u.ue);
    let badge='';
    if(u.entregaHoy) badge='<span class="badge-hoy">HOY</span>';
    else if(u.entregaManana) badge='<span class="badge-man">MA\u00d1ANA</span>';
    const ueEsc=u.ue.replace(/'/g,"\\'");
    html+=`<tr class="ue-row ${abierta?'abierta':''}" onclick="toggleUE('${ueEsc}')">
      <td><span class="caret ${abierta?'abierto':''}">\u25b6</span> <span class="ue-name">${u.ue}</span>${badge}
          <div class="ue-meta">${u.cedis} \u00b7 ${u.categ||''}</div></td>
      <td style="font-size:11px">${u.dias||'\u2014'}</td>
      <td class="n">${u.total}</td><td class="n ${u.pend>0?'pend-alert':''}">${u.pend}</td>
      <td>${barra(u.macro,u.total)}</td>${celdasMacro(u.macro)}</tr>`;
    if(abierta){
      (u.grupos||[]).forEach(g=>{
        const gk=u.ue+'||'+g.grupo;
        const gAb=gruposAbiertos.has(gk);
        const gEsc=g.grupo.replace(/'/g,"\\'");
        html+=`<tr class="grupo-row ${gAb?'abierta':''}" onclick="toggleGrupo('${ueEsc}','${gEsc}')">
          <td class="grupo-name"><span class="caret ${gAb?'abierto':''}">\u25b6</span> ${g.grupo}</td>
          <td></td><td class="n">${g.total}</td><td class="n ${g.pend>0?'pend-alert':''}">${g.pend}</td>
          <td>${barra(g.macro,g.total)}</td>${celdasMacro(g.macro)}</tr>`;
        if(gAb){
          const lista=f8cache[gk];
          if(lista===undefined){
            html+=`<tr class="f8-row"><td class="f8-load" colspan="10">Cargando Formas 8\u2026</td></tr>`;
          } else if(lista.length===0){
            html+=`<tr class="f8-row"><td class="f8-load" colspan="10">Sin Formas 8 en este grupo.</td></tr>`;
          } else {
            html+=`<tr class="f8-head"><td>Forma 8</td><td>Entrega</td><td>Tipo</td><td colspan="2">Etapa actual</td><td colspan="5">Recibida</td></tr>`;
            lista.forEach(f=>{
              const col=COLOR[f.macro]||'#888';
              const fv=f.fechaVencimiento? f.fechaVencimiento.slice(5).replace('-','/') : '\u2014';
              const fr=f.fechaRecepcion||'\u2014';
              html+=`<tr class="f8-row">
                <td class="f8-id">${f.id}</td>
                <td class="fecha-ent ${f.vencido?'fecha-venc':''}">${fv}</td>
                <td><span class="chip-tipo ${f.tipo==='URG'?'tipo-urg':'tipo-men'}">${f.tipo}</span></td>
                <td colspan="2"><span class="f8-etapa" style="background:${col}">${f.etapa}</span></td>
                <td colspan="5" class="fecha-ent">${fr}</td></tr>`;
            });
          }
        }
      });
    }
  });
  html+='</tbody></table>';
  cont.innerHTML=html;
}
function toggleUE(ue){ if(abiertas.has(ue)) abiertas.delete(ue); else abiertas.add(ue); render(); }
async function toggleGrupo(ue,grupo){
  const gk=ue+'||'+grupo;
  if(gruposAbiertos.has(gk)){ gruposAbiertos.delete(gk); render(); return; }
  gruposAbiertos.add(gk); render();               // muestra "Cargando..."
  if(f8cache[gk]===undefined){
    try{
      const res=await pedir('file=kanban_tablero_f8&ue='+encodeURIComponent(ue)+'&grupo='+encodeURIComponent(grupo));
      f8cache[gk]=(res&&res.f8)?res.f8:[];
    }catch(err){ f8cache[gk]=[]; }
    render();
  }
}
function setSort(col){ if(sortCol===col) sortDir*=-1; else {sortCol=col; sortDir=1;} render(); }
document.getElementById('btnRefresh').onclick=cargar;
['fCedis','fRegion','fGrupo','fUE'].forEach(id=>document.getElementById(id).onchange=render);
document.getElementById('fHoyMan').onchange=render;
document.getElementById('fBuscar').oninput=render;
cargar();
setInterval(()=>{ // refresco solo de agregados; respeta expandidos y caché F8
  cargar();
}, 180000);
</script>
</body>
</html>
