<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kanban de Seguimiento — Tablero del CEDIS Panamá por Unidad Ejecutora</title>
<link rel="icon" href="./favicon.ico?v=1"/>
<style>
  :root{
    --azul:#1e5a9e;--azul2:#0C447C;--deg1:#0b1f3a;--deg2:#133a74;
    --bg:#ececec;--bord:#a8a8a8;--txt:#20303f;--sub:#6b7684;
    --m-recep:#888780;--m-asig:#BA7517;--m-recol:#378ADD;--m-fact:#639922;--m-dist:#0F6E56;
    --rojo:#a12626;
    --pc-recep:#ececeb;--pc-asig:#f6ecd9;--pc-recol:#e2eefb;--pc-fact:#eaf3dd;--pc-dist:#dcefe8;
  }
  *{box-sizing:border-box;}
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--txt);}
  .num{font-family:Consolas,"Courier New",monospace;}
  .topbar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:linear-gradient(90deg,var(--deg1),var(--deg2));color:#fff;position:sticky;top:0;z-index:9999;box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .topbar img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:50%;}
  .topbar h1{font-size:15px;margin:0;font-weight:700;}
  .topbar .sub{font-size:11px;opacity:.85;margin-top:2px;}
  .topbar .spacer{flex:1;}
  .topbar .gen{font-size:11px;opacity:.85;text-align:right;line-height:1.5;}
  .wrap{max-width:1340px;margin:0 auto;padding:14px;}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;}
  .kpi{border:1px solid var(--bord);padding:12px 14px;border-radius:2px;}
  .kpi .lbl{font-size:10px;color:#4a5560;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
  .kpi .val{font-size:26px;font-weight:700;font-family:Consolas,monospace;line-height:1.1;margin-top:2px;}
  .kpi.recep{background:var(--pc-recep);} .kpi.recep .val{color:#5f5e58;}
  .kpi.asig{background:var(--pc-asig);}   .kpi.asig .val{color:#8a5810;}
  .kpi.recol{background:var(--pc-recol);} .kpi.recol .val{color:#1f6bb8;}
  .kpi.fact{background:var(--pc-fact);}   .kpi.fact .val{color:#4c7519;}
  .kpi.dist{background:var(--pc-dist);}   .kpi.dist .val{color:#0d5a48;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--bord);padding:9px 11px;margin-bottom:10px;}
  .toolbar label{font-size:11px;color:var(--sub);}
  .toolbar select,.toolbar input[type=text]{padding:5px 7px;border:1px solid var(--bord);font-size:12px;}
  .toolbar .btn{padding:6px 12px;border:1px solid var(--azul2);background:var(--azul);color:#fff;cursor:pointer;font-size:12px;font-weight:600;}
  .toolbar .btn.sec{background:#fff;color:var(--azul2);}
  .toolbar .spacer{flex:1;} .toolbar .count{font-size:11px;color:var(--sub);}
  .leyenda{display:flex;flex-wrap:wrap;gap:14px;margin:8px 2px 12px;font-size:10px;color:var(--sub);}
  .leyenda .dot{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:middle;}
  /* acordeón UE (patrón panel_confirmacion: toggle con CSS) */
  .ue-group{background:#fff;border:1px solid var(--bord);margin-bottom:6px;}
  .ue-head{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;position:relative;}
  .ue-head:hover{background:#f4f7fb;}
  .ue-group.open .ue-head{background:#eef3fa;}
  .ue-head .chev{color:var(--azul2);font-weight:700;font-size:11px;transition:transform .1s;}
  .ue-group.open .ue-head .chev{transform:rotate(90deg);}
  .ue-name{font-weight:700;color:var(--azul2);font-size:13px;}
  .ue-sub{font-size:10px;color:var(--sub);margin-left:4px;}
  .badge-hoy{font-size:9px;font-weight:700;padding:1px 6px;background:#fcebeb;color:var(--rojo);margin-left:6px;}
  .badge-man{font-size:9px;font-weight:700;padding:1px 6px;background:#faeeda;color:#854F0B;margin-left:6px;}
  .ue-head .spacer{flex:1;}
  .ue-metrics{display:flex;align-items:center;gap:10px;}
  .prog{display:flex;height:16px;width:200px;border:1px solid #ddd;overflow:hidden;background:#f6f6f6;}
  .prog span{display:block;height:100%;}
  .mtot{font-family:Consolas,monospace;font-size:12px;min-width:52px;text-align:right;}
  .mpend{font-family:Consolas,monospace;font-size:12px;min-width:60px;text-align:right;}
  .pend-alert{color:var(--rojo);font-weight:700;}
  .ue-body{display:none;padding:0 0 4px;}
  .ue-group.open .ue-body{display:block;}
  /* grupo dentro de UE */
  .grupo-group{border-top:1px dotted #dde;}
  .grupo-head{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 30px;cursor:pointer;background:#fafbfc;}
  .grupo-head:hover{background:#f0f4f8;}
  .grupo-group.open .grupo-head{background:#f0f4f8;}
  .grupo-head .chev{color:#2f4a5e;font-weight:700;font-size:10px;transition:transform .1s;}
  .grupo-group.open .grupo-head .chev{transform:rotate(90deg);}
  .grupo-name{font-size:11px;color:#2f4a5e;font-weight:700;}
  .grupo-body{display:none;}
  .grupo-group.open .grupo-body{display:block;}
  /* tabla de F8 */
  .f8-head,.f8-row{display:grid;grid-template-columns:1.4fr .6fr .5fr 1fr .8fr;gap:6px;padding:4px 12px 4px 48px;font-size:11px;align-items:center;}
  .f8-head{background:#f3f6fa;font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:#5a6b7a;font-weight:700;}
  .f8-row{border-top:1px solid #f2f2f2;}
  .f8-row:hover{background:#fafcff;}
  .f8-id{font-family:Consolas,monospace;color:#333;}
  .f8-etapa{display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:2px;color:#fff;justify-self:start;}
  .chip-tipo{font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;justify-self:start;}
  .tipo-urg{background:#fcebeb;color:var(--rojo);} .tipo-men{background:#eef2f6;color:#5a6b7a;}
  .fecha-ent{font-family:Consolas,monospace;} .fecha-venc{color:var(--rojo);font-weight:700;}
  .empty{padding:36px;text-align:center;color:var(--sub);background:#fff;border:1px solid var(--bord);}
  .loading{padding:26px;text-align:center;color:var(--sub);}
  .err{background:#fdecea;border:1px solid #f5c6cb;color:#a11b11;padding:12px 16px;margin-bottom:10px;font-size:12px;}
</style>
</head>
<body>
<div class="topbar">
  <img src="./icons/icon-512.png" alt="logo" onerror="this.style.display='none'"/>
  <div><h1>Kanban de Seguimiento &mdash; Tablero del Almac&eacute;n</h1>
    <div class="sub">Torre de Control &middot; DINALOG / CEDIS &middot; Solo lectura</div></div>
  <div class="spacer"></div><div class="gen" id="gen"></div>
</div>
<div class="wrap">
  <div id="errBox"></div>
  <div class="kpis">
    <div class="kpi recep"><div class="lbl">Recepci&oacute;n</div><div class="val num" id="k_RECEPCION">&ndash;</div></div>
    <div class="kpi asig"><div class="lbl">Asignaci&oacute;n</div><div class="val num" id="k_ASIGNACION">&ndash;</div></div>
    <div class="kpi recol"><div class="lbl">Recolecci&oacute;n</div><div class="val num" id="k_RECOLECCION">&ndash;</div></div>
    <div class="kpi fact"><div class="lbl">Facturaci&oacute;n</div><div class="val num" id="k_FACTURACION">&ndash;</div></div>
    <div class="kpi dist"><div class="lbl">Distribuci&oacute;n</div><div class="val num" id="k_DISTRIBUCION">&ndash;</div></div>
  </div>
  <div class="toolbar">
    <label>CEDIS:</label><select id="fCedis"><option value="TODOS">&mdash; Todos &mdash;</option></select>
    <label>Grupo:</label><select id="fGrupo"><option value="">&mdash; Todos &mdash;</option></select>
    <label>Unidad Ejecutora:</label><select id="fUE"><option value="">&mdash; Todas &mdash;</option></select>
    <input type="text" id="fBuscar" placeholder="Buscar UE..."/>
    <button class="btn sec" id="btnExpand">Expandir todo</button>
    <button class="btn sec" id="btnRefresh">&#8635; Actualizar</button>
    <div class="spacer"></div><span class="count" id="cnt"></span>
  </div>
  <div class="leyenda" id="leyenda"></div>
  <div id="lista"><div class="loading">Cargando tablero&hellip;</div></div>
</div>
<script>
const WEBAPP_BASE = "https://script.google.com/macros/s/AKfycbyVHDQ8IuVHibz259AiEvZ-jUfVC7fxvSSqC-wfaiiq1_13C9_TK4dVtPK0SMW4sZoJ/exec";
let F8=[], MACROS=[], expandAll=false;
const COLOR={};

async function pedir(params){
  const url=`${WEBAPP_BASE}?${params}&_ts=${Date.now()}`;
  const res=await fetch(url,{method:'GET',redirect:'follow'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function cargar(){
  document.getElementById('lista').innerHTML='<div class="loading">Cargando tablero&hellip;</div>';
  document.getElementById('errBox').innerHTML='';
  try{
    const res=await pedir('file=kanban_tablero_almacen');
    if(!res||res.ok===false) throw new Error((res&&res.msg)||'Respuesta vac\u00eda');
    F8=res.f8||[]; MACROS=res.macros||[];
    MACROS.forEach(m=>COLOR[m.clave]=m.color);
    document.getElementById('gen').innerHTML='Actualizado: '+(res.generado||'\u2014')+'<br>Hoy: '+(res.diaHoy||'\u2014')+' \u00b7 '+F8.length+' F8 activas';
    pintarLeyenda(); pintarKPIs(); poblarFiltros(); render();
  }catch(err){
    document.getElementById('errBox').innerHTML='<div class="err">No se pudo cargar el tablero: '+err.message+'. Revisa que el endpoint <b>kanban_tablero_almacen</b> est\u00e9 desplegado en el WebApp.</div>';
    document.getElementById('lista').innerHTML='';
  }
}
function pintarLeyenda(){
  document.getElementById('leyenda').innerHTML=MACROS.map(m=>`<span><span class="dot" style="background:${m.color}"></span>${m.label}</span>`).join('');
}
function pintarKPIs(){
  const c={}; MACROS.forEach(m=>c[m.clave]=0);
  F8.forEach(f=>{ if(c[f.macro]!=null) c[f.macro]++; });
  MACROS.forEach(m=>{ const el=document.getElementById('k_'+m.clave); if(el) el.textContent=(c[m.clave]||0).toLocaleString(); });
}
function poblarFiltros(){
  const cedis=[...new Set(F8.map(f=>f.cedis))].filter(Boolean).sort();
  const grupos=[...new Set(F8.map(f=>f.grupo))].filter(Boolean).sort();
  const ues=[...new Set(F8.map(f=>f.ue))].filter(Boolean).sort();
  fill('fCedis','TODOS','\u2014 Todos \u2014',cedis);
  fill('fGrupo','','\u2014 Todos \u2014',grupos);
  fill('fUE','','\u2014 Todas \u2014',ues);
}
function fill(id,allVal,allLbl,arr){
  const s=document.getElementById(id), prev=s.value;
  s.innerHTML=`<option value="${allVal}">${allLbl}</option>`+arr.map(x=>`<option>${x}</option>`).join('');
  s.value=[...s.options].some(o=>o.value===prev)?prev:allVal;
}
const ES_PEND={RECEPCION:1,ASIGNACION:1,RECOLECCION:1};
function macroVacio(){ const m={}; MACROS.forEach(x=>m[x.clave]=0); return m; }
function pendDe(macro){ let p=0; for(const k in ES_PEND) p+=(macro[k]||0); return p; }
function barra(macro,total){
  const t=total||1;
  return `<div class="prog">${MACROS.map(m=>{const v=macro[m.clave]||0; return v>0?`<span style="width:${v/t*100}%;background:${m.color}" title="${m.label}: ${v}"></span>`:'';}).join('')}</div>`;
}
function fVenc(s){ return s? s.slice(5).replace('-','/') : '\u2014'; }

function filtrados(){
  const fc=document.getElementById('fCedis').value;
  const fg=document.getElementById('fGrupo').value;
  const fu=document.getElementById('fUE').value;
  const q=document.getElementById('fBuscar').value.trim().toLowerCase();
  return F8.filter(f=>{
    if(fc && fc!=='TODOS' && f.cedis!==fc) return false;
    if(fg && f.grupo!==fg) return false;
    if(fu && f.ue!==fu) return false;
    if(q && !f.ue.toLowerCase().includes(q)) return false;
    return true;
  });
}
function render(){
  const rows=filtrados();
  const cont=document.getElementById('lista');
  if(!rows.length){cont.innerHTML='<div class="empty">No hay Formas 8 con este filtro.</div>';document.getElementById('cnt').textContent='0 UE';return;}

  // agrupar UE -> grupo -> [f8]  (patrón byUE de panel_confirmacion)
  const byUE=new Map();
  rows.forEach(f=>{
    if(!byUE.has(f.ue)) byUE.set(f.ue,{cedis:f.cedis,dias:f.dias,grupos:new Map(),all:[]});
    const u=byUE.get(f.ue);
    u.all.push(f);
    if(!u.grupos.has(f.grupo)) u.grupos.set(f.grupo,[]);
    u.grupos.get(f.grupo).push(f);
  });

  const hoy=new Date(); const dow=hoy.getDay();
  const DIAS=['DOMINGO','LUNES','MARTES','MIERCOLES','JUEVES','VIERNES','SABADO'];
  function entregaHoyMan(dias){
    if(!dias) return {hoy:false,man:false};
    const d=dias.toUpperCase();
    const hoyN=DIAS[dow], manN=DIAS[(dow+1)%7];
    return {hoy:d.indexOf(hoyN.slice(0,3))>=0, man:d.indexOf(manN.slice(0,3))>=0};
  }

  const ues=[...byUE.keys()].sort((a,b)=>{
    const pa=pendDe(macroDe(byUE.get(a).all)), pb=pendDe(macroDe(byUE.get(b).all));
    return pb-pa;
  });
  document.getElementById('cnt').textContent=ues.length+' UE';

  let html='';
  ues.forEach((ue,gi)=>{
    const u=byUE.get(ue);
    const mUE=macroDe(u.all), totUE=u.all.length, pendUE=pendDe(mUE);
    const open=expandAll||gi===0;
    const em=entregaHoyMan(u.dias);
    let badge='';
    if(em.hoy) badge='<span class="badge-hoy">HOY</span>';
    else if(em.man) badge='<span class="badge-man">MA\u00d1ANA</span>';
    html+=`<div class="ue-group${open?' open':''}">
      <div class="ue-head" onclick="this.parentNode.classList.toggle('open')">
        <span class="chev">\u25b6</span>
        <span class="ue-name">${ue}</span>${badge}
        <span class="ue-sub">${u.cedis} \u00b7 ${u.dias||'\u2014'}</span>
        <span class="spacer"></span>
        <span class="ue-metrics">
          ${barra(mUE,totUE)}
          <span class="mtot">${totUE}</span>
          <span class="mpend ${pendUE>0?'pend-alert':''}">pend ${pendUE}</span>
        </span>
      </div>
      <div class="ue-body">`;
    // grupos ordenados por pendientes
    const grupos=[...u.grupos.keys()].sort((a,b)=>pendDe(macroDe(u.grupos.get(b)))-pendDe(macroDe(u.grupos.get(a))));
    grupos.forEach(g=>{
      const lista=u.grupos.get(g), mG=macroDe(lista), totG=lista.length, pendG=pendDe(mG);
      html+=`<div class="grupo-group">
        <div class="grupo-head" onclick="this.parentNode.classList.toggle('open')">
          <span class="chev">\u25b6</span>
          <span class="grupo-name">${g}</span>
          <span class="spacer" style="flex:1"></span>
          <span class="ue-metrics">${barra(mG,totG)}<span class="mtot">${totG}</span><span class="mpend ${pendG>0?'pend-alert':''}">pend ${pendG}</span></span>
        </div>
        <div class="grupo-body">
          <div class="f8-head"><span>Forma 8</span><span>Entrega</span><span>Tipo</span><span>Etapa actual</span><span>Recibida</span></div>`;
      // F8 ordenados por fecha de entrega
      lista.slice().sort((a,b)=>{
        const fa=a.fechaVencimiento||'9999-99-99', fb=b.fechaVencimiento||'9999-99-99';
        return fa<fb?-1:(fa>fb?1:0);
      }).forEach(f=>{
        html+=`<div class="f8-row">
          <span class="f8-id">${f.id}</span>
          <span class="fecha-ent ${f.vencido?'fecha-venc':''}">${fVenc(f.fechaVencimiento)}</span>
          <span><span class="chip-tipo ${f.tipo==='URG'?'tipo-urg':'tipo-men'}">${f.tipo}</span></span>
          <span><span class="f8-etapa" style="background:${COLOR[f.macro]||'#888'}">${f.etapa}</span></span>
          <span class="fecha-ent">${f.fechaRecepcion||'\u2014'}</span>
        </div>`;
      });
      html+=`</div></div>`;
    });
    html+=`</div></div>`;
  });
  cont.innerHTML=html;
}
function macroDe(lista){
  const m=macroVacio();
  lista.forEach(f=>{ if(m[f.macro]!=null) m[f.macro]++; });
  return m;
}
document.getElementById('btnRefresh').onclick=cargar;
document.getElementById('btnExpand').onclick=function(){expandAll=!expandAll;this.textContent=expandAll?'Colapsar todo':'Expandir todo';render();};
['fCedis','fGrupo','fUE'].forEach(id=>document.getElementById(id).onchange=render);
document.getElementById('fBuscar').oninput=render;
cargar();
setInterval(cargar,180000);
</script>
</body>
</html>
